<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Portal Abang Mie BHP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Link ke manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #fff8f2;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      font-size: 1.8em;
      color: #d97b2d;
      margin: 20px 0 10px;
    }

    .link-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
      max-width: 320px;
      padding: 0 15px;
    }

    .link-box {
      background-color: #ffe5cc;
      border-radius: 20px;
      padding: 12px;
      margin: 10px auto;
      width: 100%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .link-box:hover {
      transform: scale(1.05);
    }

    .link-box a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
      font-size: 1.1em;
      display: block;
    }

    iframe {
      width: 95%;
      height: 70vh;
      border: none;
      border-radius: 12px;
      margin: 20px auto;
      display: block;
    }

    .back-btn {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #d97b2d;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1em;
      cursor: pointer;
    }

    .back-btn:hover {
      background-color: #b8641f;
    }

    footer {
      margin-top: 30px;
      padding: 10px;
    }

    footer p {
      font-size: 0.9em;
      color: #666;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.5em;
      }
      .link-box {
        font-size: 1em;
        padding: 10px;
      }
      iframe {
        width: 95%;
        height: 60vh;
      }
    }
  </style>
</head>
<body>
  <!-- Tajuk utama -->
  <h1>Portal Abang Mie</h1>

  <!-- Menu -->
  <div class="link-container" id="menu">
    <div class="link-box">
      <a href="#" onclick="openLink('https://mohdrozaimi205.github.io/budi95v4/')">BUDI95</a>
    </div>
    <div class="link-box">
      <a href="#" onclick="openLink('https://mohdrozaimi205.github.io/cashcarddieselbhp/')">Cash Card BHP</a>
    </div>
    <div class="link-box">
      <a href="#" onclick="openLink('https://mohdrozaimi205.github.io/cashcardmanual/')">Cash Card customer request Full Amount</a>
    </div>
  </div>

  <!-- Paparan link -->
  <div id="content" style="display:none;">
    <iframe id="contentFrame"></iframe>
    <button class="back-btn" onclick="goBack()">⬅ Kembali</button>
  </div>

  <!-- Footer branding kecil -->
  <footer>
    <p>Created by Abang Mie BHP</p>
  </footer>

  <script>
    function openLink(url) {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      document.getElementById('contentFrame').src = url;
    }

    function goBack() {
      document.getElementById('menu').style.display = 'flex';
      document.getElementById('content').style.display = 'none';
      document.getElementById('contentFrame').src = '';
    }

    // Register service worker untuk PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
